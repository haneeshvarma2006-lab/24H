<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Geist, 'Helvetica Neue', Arial, sans-serif">
  <title>Hayara.ai architecture: how a hospital bill flows from upload to export</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b665e"/></marker>
    <style>
      .box{fill:#fffefb;stroke:#d3cfc4;stroke-width:1.2}
      .ink{fill:#1c1a17}.mut{fill:#6b665e}.acc{fill:#3a4bc9}.grn{fill:#13795b}.org{fill:#8a4b08}
      .t{font-size:15px;font-weight:600;fill:#1c1a17}.s{font-size:12.5px;fill:#6b665e}.n{font:500 11px 'Geist Mono',Menlo,monospace;fill:#9a958b}
      .l{stroke:#6b665e;stroke-width:1.4;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1200" height="700" fill="#f5f4f0"/>
  <text x="48" y="58" font-family="'Instrument Serif', Georgia, serif" font-size="34" class="ink">How Hayara reads and checks a bill</text>
  <text x="48" y="84" class="s">The AI only reads. Every number is re-checked by rules before it reaches the spreadsheet.</text>

  <!-- 1 upload -->
  <rect class="box" x="48" y="130" width="190" height="150" rx="14"/>
  <text x="66" y="156" class="n">01</text><text x="66" y="180" class="t">Upload</text>
  <text x="66" y="204" class="s">Scan, phone photo</text><text x="66" y="222" class="s">or PDF · bill or</text><text x="66" y="240" class="s">insurance claim</text>
  <text x="66" y="264" class="s">Real-file check, 20 MB</text>

  <!-- 2 read -->
  <rect class="box" x="290" y="110" width="300" height="198" rx="14"/>
  <text x="308" y="136" class="n">02</text><text x="308" y="160" class="t">Read the fields</text>
  <rect x="308" y="174" width="264" height="48" rx="9" fill="#eceefb"/>
  <text x="322" y="194" font-size="13" font-weight="600" class="acc">Cloud: Gemini vision (optional)</text>
  <text x="322" y="212" class="s">reads layout + gives confidence</text>
  <rect x="308" y="230" width="264" height="62" rx="9" fill="#ecebe5"/>
  <text x="322" y="250" font-size="13" font-weight="600" class="ink">Local: PDF text · Tesseract OCR</text>
  <text x="322" y="268" class="s">+ label rules + our trained field</text><text x="322" y="282" class="s">finder · offline, no API cost</text>

  <!-- 3 locate -->
  <rect class="box" x="642" y="130" width="230" height="150" rx="14"/>
  <text x="660" y="156" class="n">03</text><text x="660" y="180" class="t">Click-to-source</text>
  <text x="660" y="204" class="s">Each value is matched to</text><text x="660" y="222" class="s">the words on the scan, so a</text><text x="660" y="240" class="s">reviewer sees where it was</text><text x="660" y="258" class="s">printed</text>

  <!-- 4 validate -->
  <rect class="box" x="924" y="110" width="228" height="290" rx="14"/>
  <text x="942" y="136" class="n">04</text><text x="942" y="160" class="t">Check every number</text>
  <g class="s">
    <text x="942" y="190">· required fields present</text>
    <text x="942" y="214">· qty × rate = amount</text>
    <text x="942" y="238">· no duplicate charges</text>
    <text x="942" y="262">· items = subtotal</text>
    <text x="942" y="286">· subtotal − discount + tax</text><text x="954" y="304">= total</text>
    <text x="942" y="328">· AI confidence ≥ 80%</text>
    <text x="942" y="352">· claim = matching bill</text>
  </g>
  <text x="942" y="384" font-size="12" font-weight="600" class="acc">7 rules, all deterministic</text>

  <path class="l" d="M238 205H284"/><path class="l" d="M590 205H636"/><path class="l" d="M872 205H918"/>

  <!-- outcomes -->
  <path class="l" d="M990 400V470H860"/>
  <text x="1000" y="440" class="s">any check fails</text><text x="1000" y="456" class="s">or unsure</text>
  <path class="l" d="M1100 400V560"/>
  <text x="1110" y="490" class="s">all pass</text>

  <rect x="520" y="440" width="334" height="120" rx="14" fill="#fbefdc" stroke="#e3c79e"/>
  <text x="540" y="468" class="t">Human review queue</text>
  <text x="540" y="492" class="s">Scan and fields side by side, issue highlighted.</text>
  <text x="540" y="510" class="s">Fix a value → re-checked instantly → approve.</text>
  <text x="540" y="540" font-size="12.5" font-weight="600" class="org">Every fix is saved as training data</text>

  <path class="l" d="M520 520H420"/>
  <rect x="150" y="470" width="264" height="104" rx="14" fill="#ecebe5" stroke="#d3cfc4"/>
  <text x="168" y="498" class="t">Field model retrains</text>
  <text x="168" y="522" class="s">TF-IDF + logistic regression on</text><text x="168" y="540" class="s">OCR lines · SROIE held-out</text><text x="168" y="558" class="s">accuracy 21.0% → 28.8%</text>
  <path class="l" d="M282 470C282 390 360 340 404 312" stroke-dasharray="4 4"/>
  <text x="300" y="440" class="s">better local reading</text>

  <rect x="980" y="566" width="172" height="86" rx="14" fill="#e5f2eb" stroke="#b9dcc8"/>
  <text x="998" y="594" class="t">Approved</text>
  <text x="998" y="616" class="s">Export to Excel,</text><text x="998" y="634" class="s">CSV or JSON</text>
  <path class="l" d="M854 520H900Q930 520 930 560V600H974"/>
  <text x="868" y="590" class="s">approved</text>

  <!-- footer -->
  <line x1="48" y1="615" x2="900" y2="615" stroke="#e4e1d9"/>
  <text x="48" y="645" font-size="12.5" font-weight="600" class="ink">Around everything:</text>
  <text x="172" y="645" class="s">email accounts (scrypt hashes, HttpOnly cookies) · each account sees only its own bills ·</text>
  <text x="48" y="666" class="s">CSP + no-store · rate limits · formula-safe exports · FastAPI + SQLite · Docker on Render</text>
</svg>
