<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hayara.ai · Hospital bill reader</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a65f7'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f6f9; --panel: #fff; --ink: #102a43; --muted: #52606d; --line: #e1e6ec;
    --blue: #0a65f7; --blue-soft: #e7f0fe; --blue-ink: #0747b3;
    --orange: #f08722; --orange-soft: #fdeedd; --orange-ink: #9a4a06;
    --green: #12805c; --green-soft: #e3f5ec;
    --red: #c81e1e; --red-soft: #fdecec;
    --radius: 10px;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--bg);
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* top bar */
  .top { display: flex; align-items: center; gap: 24px; padding: 12px 20px; background: var(--ink); color: #fff; }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .logo { width: 38px; height: 38px; border-radius: 10px; background: var(--blue); display: grid; place-items: center;
          font-weight: 800; font-size: 20px; }
  .brand strong { display: block; font-size: 19px; letter-spacing: .2px; }
  .brand span { font-size: 13px; color: #c7d2de; }
  .stats { display: flex; gap: 18px; font-size: 13px; color: #c7d2de; }
  .stats b { display: block; font-size: 20px; color: #fff; }
  .export { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #c7d2de; }
  .export a { color: #fff; text-decoration: none; padding: 7px 12px; border: 1px solid #3e5872; border-radius: 8px; font-weight: 600; }
  .export a:hover { background: #1f3b57; }
  .export a.main { background: var(--blue); border-color: var(--blue); }

  .layout { flex: 1; display: grid; grid-template-columns: 300px 1fr; min-height: 0; }

  /* sidebar */
  .side { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-right: 1px solid var(--line); background: var(--panel); min-height: 0; }
  .drop { display: grid; gap: 4px; padding: 18px 14px; text-align: center; background: var(--blue-soft);
          border: 2px dashed #9dbdf5; border-radius: var(--radius); }
  .drop strong { color: var(--blue-ink); font-size: 15px; }
  .drop span { font-size: 12.5px; color: var(--muted); }
  .drop.over { border-color: var(--blue); background: #d6e6fd; }
  .tabs { display: flex; gap: 4px; padding: 3px; background: var(--bg); border-radius: 9px; }
  .tabs button { flex: 1; border: 0; background: none; padding: 7px 4px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .tabs button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgb(16 42 67 / .12); }
  .list { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: grid; gap: 6px; align-content: start; }
  .item { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 10px 12px;
          background: var(--panel); border: 1px solid var(--line); border-radius: 9px; }
  .item:hover { border-color: #b8c4d1; }
  .item.on { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .s { grid-column: 1; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .m { grid-column: 2; grid-row: 1 / 3; display: grid; justify-items: end; align-content: center; gap: 3px; font-size: 13px; }
  .none, .busy { font-size: 13px; color: var(--muted); padding: 10px 12px; }
  .busy { display: flex; gap: 8px; align-items: center; border: 1px dashed var(--line); border-radius: 9px; }
  .spin { width: 14px; height: 14px; border: 2px solid var(--blue-soft); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .pill.approved { background: var(--green-soft); color: var(--green); }
  .pill.review { background: var(--orange-soft); color: var(--orange-ink); }

  /* main */
  main { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .empty { margin: auto; max-width: 560px; text-align: center; padding: 24px; }
  .empty h1 { font-size: 26px; margin: 0 0 8px; }
  .empty p { color: var(--muted); margin: 0 0 22px; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: left; }
  .steps div { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; font-size: 13.5px; color: var(--muted); }
  .steps b { display: block; color: var(--ink); margin-bottom: 4px; font-size: 14.5px; }

  .bar { display: flex; align-items: center; gap: 14px; padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .bar h1 { margin: 0; font-size: 20px; }
  .bar p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .bar .grow { flex: 1; min-width: 0; }
  .btn { border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 700; background: var(--green); color: #fff; }
  .btn:hover { filter: brightness(1.08); }

  .panes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(420px, 1fr); }
  .viewer { overflow: auto; padding: 16px; background: #dfe4ea; }
  .page { position: relative; max-width: 900px; margin: 0 auto; background: #fff; box-shadow: 0 2px 10px rgb(16 42 67 / .15); }
  .page img { display: block; width: 100%; }
  .page iframe { display: block; width: 100%; height: calc(100vh - 170px); border: 0; }
  .box { position: absolute; border-radius: 3px; padding: 0; background: none; border: 2px solid transparent; }
  .box.flag { border-color: var(--orange); background: rgb(240 135 34 / .12); }
  .box.flag.err { border-color: var(--red); background: rgb(200 30 30 / .10); }
  .box.active { border-color: var(--blue); background: rgb(10 101 247 / .16); box-shadow: 0 0 0 4px rgb(10 101 247 / .18); }
  .note { font-size: 12.5px; color: var(--muted); text-align: center; margin: 10px 0 0; }

  .data { overflow-y: auto; padding: 16px 20px 40px; background: var(--panel); border-left: 1px solid var(--line); display: grid; gap: 16px; align-content: start; }
  .data h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 8px; }

  .checks { border-radius: var(--radius); padding: 12px 14px; }
  .checks.ok { background: var(--green-soft); color: var(--green); font-weight: 600; }
  .checks.bad { background: var(--red-soft); }
  .checks.bad h2 { color: var(--red); }
  .checks.warn { background: var(--orange-soft); }
  .checks.warn h2 { color: var(--orange-ink); }
  .issue { width: 100%; text-align: left; display: flex; gap: 10px; align-items: baseline; background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; padding: 8px 10px; margin-top: 6px; font-size: 14px; }
  .issue:hover { border-color: var(--red); }
  .issue.warn:hover { border-color: var(--orange); }
  .issue i { font-style: normal; font-weight: 800; width: 18px; height: 18px; flex: none; border-radius: 50%; display: grid; place-items: center;
             font-size: 12px; color: #fff; background: var(--red); transform: translateY(2px); }
  .issue.warn i { background: var(--orange); }
  .issue small { display: block; color: var(--muted); font-size: 12px; }

  .math { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13.5px; }
  .math span { padding: 6px 10px; border-radius: 8px; background: var(--bg); }
  .math span.ok { background: var(--green-soft); color: var(--green); }
  .math span.no { background: var(--red-soft); color: var(--red); font-weight: 700; }
  .math em { font-style: normal; color: var(--muted); }

  details { border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 14px 10px; }
  summary { cursor: pointer; padding: 8px 0 6px; font-weight: 700; font-size: 14px; }
  summary small { font-weight: 500; color: var(--muted); }
  .field { display: grid; grid-template-columns: 130px 1fr 48px; align-items: center; gap: 8px; padding: 3px 0; }
  .field label { font-size: 13px; color: var(--muted); }
  .field input, td input { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: #fff; }
  .field input:hover, td input:hover { border-color: #b8c4d1; }
  .field input:focus, td input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px rgb(10 101 247 / .18); }
  .field.err input, tr.err input { border-color: var(--red); background: var(--red-soft); }
  .field.warn input, tr.warn input { border-color: var(--orange); background: var(--orange-soft); }
  .msg { grid-column: 2 / 4; font-size: 12px; color: var(--red); margin: -1px 0 3px; }
  .field.warn .msg { color: var(--orange-ink); }
  .conf { font-size: 12px; text-align: right; color: var(--muted); }
  .conf.low { color: var(--orange-ink); font-weight: 700; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 4px; }
  td { padding: 3px 4px; }
  td:first-child { color: var(--muted); width: 22px; }
  .w-num { width: 92px; }
  .w-qty { width: 56px; }
  td input.num, .field input.num { text-align: right; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 11px 18px;
           border-radius: 9px; font-size: 14px; box-shadow: 0 6px 20px rgb(16 42 67 / .3); opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; }
  .toast.show { opacity: 1; }
  .toast.error { background: var(--red); }
  .toast.good { background: var(--green); }

  @media (max-width: 1100px) {
    .stats { display: none; }
    .panes { grid-template-columns: 1fr; overflow-y: auto; }
    .viewer, .data { overflow: visible; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">H</div>
    <div><strong>Hayara.ai</strong><span>AI reads the bill. Math checks the AI. You approve only what's uncertain.</span></div>
  </div>
  <div class="stats" id="stats" aria-live="polite"></div>
  <nav class="export" aria-label="Export">
    <span>Export</span>
    <a class="main" href="/export?format=xlsx">Excel</a>
    <a href="/export?format=csv">CSV</a>
    <a href="/export?format=json" download="hayara_export.json">JSON</a>
  </nav>
</header>

<div class="layout">
  <aside class="side">
    <button class="drop" id="drop" type="button">
      <strong>Upload bills</strong>
      <span>Drop scans or phone photos here, or click to choose<br>JPG · PNG · WEBP · PDF</span>
    </button>
    <input class="sr-only" id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple tabindex="-1" aria-hidden="true">
    <div class="tabs" id="tabs" role="group" aria-label="Filter bills">
      <button type="button" data-tab="all" aria-pressed="true">All</button>
      <button type="button" data-tab="review" aria-pressed="false">To review</button>
      <button type="button" data-tab="approved" aria-pressed="false">Approved</button>
    </div>
    <ul class="list" id="list" aria-label="Bills"></ul>
  </aside>
  <main id="main"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const LABELS = {
  patient_name: 'Patient name', uhid: 'UHID', age: 'Age', gender: 'Gender',
  hospital_name: 'Hospital', hospital_address: 'Address', doctor: 'Doctor',
  bill_no: 'Bill no.', bill_date: 'Bill date', admission_date: 'Admitted', discharge_date: 'Discharged',
  subtotal: 'Subtotal', discount: 'Discount', tax: 'Tax / GST', total: 'Total',
  insurer: 'Insurer', tpa: 'TPA', policy_no: 'Policy no.', claim_no: 'Claim no.', claimed_amount: 'Claimed amount',
};
const GROUPS = [
  ['Patient', ['patient_name', 'uhid', 'age', 'gender']],
  ['Hospital & bill', ['hospital_name', 'hospital_address', 'doctor', 'bill_no', 'bill_date', 'admission_date', 'discharge_date']],
  ['Amounts', ['subtotal', 'discount', 'tax', 'total']],
  ['Insurance', ['insurer', 'tpa', 'policy_no', 'claim_no', 'claimed_amount']],
];
const MONEY = new Set(['subtotal', 'discount', 'tax', 'total', 'claimed_amount']);
const COLS = [['description', 'Description', ''], ['qty', 'Qty', 'w-qty'], ['rate', 'Rate', 'w-num'], ['amount', 'Amount', 'w-num']];
const MIN_CONFIDENCE = 0.8;  // same threshold as backend/validate.py

const $ = s => document.querySelector(s);
const list = $('#list'), main = $('#main'), fileInput = $('#file');
let bills = [], tab = 'all', current = null, pending = [], saving = Promise.resolve(), toastTimer;

// everything shown comes from uploads or the AI, so it is always escaped
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// same parsing as backend amount(): '₹1,23,456.50' -> 123456.5
const num = v => { const m = String(v ?? '').match(/-?\d[\d,]*(?:\.\d+)?/); return m ? parseFloat(m[0].replace(/,/g, '')) : null; };
const money = v => { const n = num(v); return n === null ? '—' : n.toLocaleString('en-IN', { style: 'currency', currency: 'INR' }); };
const srcKey = key => key.startsWith('line_items.') ? key.split('.').slice(0, 2).join('.') : key;
const label = key => key.startsWith('line_items.') ? `Line ${+key.split('.')[1] + 1}` : (LABELS[key] || key);
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

function toast(text, kind = '') {
  const t = $('#toast');
  t.textContent = text;
  t.className = `toast show ${kind}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast', kind === 'error' ? 7000 : 3500);
}

async function api(path, options = {}) {
  const res = await fetch(path, options);
  const body = (res.headers.get('content-type') || '').includes('json') ? await res.json() : null;
  if (!res.ok) {
    const detail = body && body.detail;
    throw new Error(typeof detail === 'string' ? detail : detail ? JSON.stringify(detail) : `${res.status} ${res.statusText}`);
  }
  return body;
}

/* ---------- list ---------- */

async function loadBills() {
  bills = await api('/bills');
  renderList();
}

function renderList() {
  const review = bills.filter(b => b.status === 'review').length;
  $('#stats').innerHTML = `<div><b class="num">${bills.length}</b>bills</div>
    <div><b class="num">${review}</b>need review</div><div><b class="num">${bills.length - review}</b>approved</div>`;
  for (const b of $('#tabs').children) b.setAttribute('aria-pressed', b.dataset.tab === tab);

  const shown = tab === 'all' ? bills : bills.filter(b => b.status === tab);
  list.innerHTML =
    pending.map(name => `<li class="busy"><span class="spin" aria-hidden="true"></span>Reading ${esc(name)}…</li>`).join('') +
    (shown.length ? shown.map(b => `<li><button type="button" class="item ${current && b.id === current.id ? 'on' : ''}" data-id="${b.id}">
        <span class="t">${esc(b.patient_name || 'Patient name missing')}</span>
        <span class="s">${esc(b.hospital_name || b.filename)}</span>
        <span class="m"><span class="num">${money(b.total)}</span>
          <span class="pill ${b.status}">${b.status === 'approved' ? 'Approved' : plural(b.issue_count, 'issue')}</span></span>
      </button></li>`).join('')
    : pending.length ? '' : `<li class="none">${bills.length ? 'Nothing here.' : 'No bills yet. Upload one to start.'}</li>`);
}

/* ---------- detail ---------- */

function fieldRow(key, f, issue) {
  const id = `f-${key}`;
  const conf = String(f.value).trim() ? Math.round(f.confidence * 100) : null;
  const cls = issue ? (issue.rule === 'low_confidence' ? 'warn' : 'err') : '';
  return `<div class="field ${cls}">
    <label for="${id}">${esc(LABELS[key])}</label>
    <input id="${id}" data-key="${key}" value="${esc(f.value)}" ${MONEY.has(key) ? 'class="num" inputmode="decimal"' : ''}
      ${issue ? `aria-describedby="${id}-msg" aria-invalid="true"` : ''}>
    <span class="conf ${conf !== null && f.confidence < MIN_CONFIDENCE ? 'low' : ''}" title="How sure the AI is it read this correctly">${conf === null ? '' : conf + '%'}</span>
    ${issue ? `<p class="msg" id="${id}-msg">${esc(issue.message)}</p>` : ''}
  </div>`;
}

function renderDetail() {
  const b = current, d = b.data, f = d.fields;
  const issueFor = {};  // first issue per field key; line item issues also mark their row
  for (const i of b.issues) {
    issueFor[i.field] ??= i;
    issueFor[srcKey(i.field)] ??= i;
  }
  const sources = d.sources || {};

  const boxes = Object.entries(sources).map(([key, [x, y, w, h]]) => {
    const issue = issueFor[key];
    const cls = issue ? `flag ${issue.rule === 'low_confidence' ? '' : 'err'}` : '';
    return `<button type="button" class="box ${cls}" data-src="${esc(key)}" aria-label="${esc(label(key))} on the scan"
      style="left:calc(${x * 100}% - 4px);top:calc(${y * 100}% - 3px);width:calc(${w * 100}% + 8px);height:calc(${h * 100}% + 6px)"></button>`;
  }).join('');

  const itemsSum = d.line_items.reduce((s, i) => s + (num(i.amount) ?? 0), 0);
  const rules = new Set(b.issues.map(i => i.rule));
  const step = (text, bad) => `<span class="${bad ? 'no' : 'ok'}">${text}</span>`;

  main.innerHTML = `
    <div class="bar">
      <div class="grow">
        <h1>${esc(f.patient_name.value || 'Patient name missing')}</h1>
        <p>${[f.hospital_name.value, f.bill_no.value && `Bill ${f.bill_no.value}`, f.bill_date.value, b.filename].filter(Boolean).map(esc).join(' · ')}</p>
      </div>
      <span class="pill ${b.status}">${b.status === 'approved' ? 'Approved' : 'Needs review'}</span>
      ${b.status === 'review' ? '<button type="button" class="btn" id="approve">Approve as is</button>' : ''}
    </div>
    <div class="panes">
      <div class="viewer" id="viewer">
        <div class="page">
          ${b.mime_type === 'application/pdf'
            ? `<iframe src="/bills/${b.id}/file" title="Scan of ${esc(b.filename)}"></iframe>`
            : `<img src="/bills/${b.id}/file" alt="Scan of ${esc(b.filename)}">${boxes}`}
        </div>
        <p class="note">${Object.keys(sources).length
          ? 'Hover or click a field to see where it was read on the scan.'
          : 'Highlights on the scan are available for image uploads.'}</p>
      </div>
      <div class="data">
        ${b.issues.length ? `<section class="checks ${b.issues.some(i => i.rule !== 'low_confidence') ? 'bad' : 'warn'}" aria-labelledby="checks-h">
            <h2 id="checks-h">${plural(b.issues.length, 'issue')} to check${b.status === 'approved' ? ' · approved by reviewer' : ''}</h2>
            ${b.issues.map(i => `<button type="button" class="issue ${i.rule === 'low_confidence' ? 'warn' : ''}" data-target="${esc(i.field)}">
              <i aria-hidden="true">${i.rule === 'low_confidence' ? '?' : '!'}</i>
              <span>${esc(i.message)}<small>${esc(label(i.field))} · click to fix</small></span></button>`).join('')}
          </section>`
        : `<section class="checks ok">✓ All checks passed: required fields, line math, duplicates, subtotal, total and AI confidence.</section>`}

        <section aria-labelledby="math-h">
          <h2 id="math-h">Math check</h2>
          <div class="math num">
            ${step(`Items ${money(itemsSum)}`, rules.has('items_sum') || rules.has('line_math'))}<em>→</em>
            ${step(`Subtotal ${money(f.subtotal.value)}`, rules.has('items_sum'))}<em>− discount + tax →</em>
            ${step(`Total ${money(f.total.value)}`, rules.has('total_math'))}
          </div>
        </section>

        ${GROUPS.map(([title, keys]) => {
          const filled = keys.filter(k => String(f[k].value).trim()).length;
          const flagged = keys.some(k => issueFor[k]);
          return `<details ${filled || flagged ? 'open' : ''}>
            <summary>${title} <small>${filled ? '' : '· not on this document'}</small></summary>
            ${keys.map(k => fieldRow(k, f[k], issueFor[k])).join('')}
          </details>`;
        }).join('')}

        <section aria-labelledby="items-h">
          <h2 id="items-h">Line items (${d.line_items.length})</h2>
          <table>
            <thead><tr><th>#</th>${COLS.map(([, name, w]) => `<th class="${w}">${name}</th>`).join('')}<th class="w-qty">AI</th></tr></thead>
            <tbody>${d.line_items.map((item, n) => {
              const issue = issueFor[`line_items.${n}`];
              const cls = issue ? (issue.rule === 'low_confidence' ? 'warn' : 'err') : '';
              return `<tr class="${cls}" ${issue ? `title="${esc(issue.message)}"` : ''}><td>${n + 1}</td>
                ${COLS.map(([col, name]) => `<td><input data-key="line_items.${n}.${col}" value="${esc(item[col])}"
                  aria-label="Line ${n + 1} ${name.toLowerCase()}" ${col === 'description' ? '' : 'class="num" inputmode="decimal"'}></td>`).join('')}
                <td class="conf ${item.confidence < MIN_CONFIDENCE ? 'low' : ''}">${Math.round(item.confidence * 100)}%</td></tr>`;
            }).join('')}</tbody>
          </table>
        </section>
      </div>
    </div>`;
}

function highlight(key) {
  const src = srcKey(key);
  for (const box of main.querySelectorAll('.box.active')) box.classList.remove('active');
  const box = main.querySelector(`.box[data-src="${src}"]`);
  if (!box) return;
  box.classList.add('active');
  const viewer = $('#viewer'), r = box.getBoundingClientRect(), v = viewer.getBoundingClientRect();
  if (r.top < v.top || r.bottom > v.bottom) viewer.scrollBy({ top: r.top - v.top - v.height / 3, behavior: 'smooth' });
}

function focusField(key) {
  const input = main.querySelector(`input[data-key="${key}"]`) || main.querySelector(`input[data-key^="${key}."]`);
  if (!input) return;
  input.closest('details')?.setAttribute('open', '');
  input.focus();
  input.select();
}

async function select(id) {
  try {
    current = await api(`/bills/${id}`);
  } catch (e) {
    current = null;
    renderEmpty();
    return toast(e.message, 'error');
  }
  history.replaceState(null, '', `#bill/${id}`);
  renderDetail();
  renderList();
}

function save(input) {
  const key = input.dataset.key, value = input.value, id = current.id;
  if (value === input.defaultValue) return;
  // one PATCH at a time, so fast tabbing through fields never races
  saving = saving.then(async () => {
    try {
      const updated = await api(`/bills/${id}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ field: key, value }),
      });
      if (!current || current.id !== id) return loadBills();
      const focused = document.activeElement?.dataset?.key;
      const scroll = [$('#viewer')?.scrollTop, main.querySelector('.data')?.scrollTop];
      current = updated;
      renderDetail();
      $('#viewer').scrollTop = scroll[0] || 0;
      main.querySelector('.data').scrollTop = scroll[1] || 0;
      if (focused) main.querySelector(`input[data-key="${focused}"]`)?.focus();
      toast(updated.issues.length ? `Saved ${label(key)}. ${plural(updated.issues.length, 'issue')} left.`
                                  : `Saved ${label(key)}. All checks pass ✓`, updated.issues.length ? '' : 'good');
      await loadBills();
    } catch (e) {
      toast(`Could not save ${label(key)}: ${e.message}`, 'error');
      input.value = input.defaultValue;
    }
  });
}

function renderEmpty() {
  main.innerHTML = `<div class="empty">
    <h1>Upload a hospital bill to start</h1>
    <p>Any hospital, any layout: scanned PDF or a phone photo.</p>
    <div class="steps">
      <div><b>1 · AI reads</b>Patient details, every charge, totals and claim data.</div>
      <div><b>2 · Math checks</b>Items, subtotal, tax and total must add up. Missing fields are flagged.</div>
      <div><b>3 · You approve</b>Only uncertain bills need you. Then export to Excel.</div>
    </div>
  </div>`;
}

async function upload(files) {
  for (const file of files) {
    pending.push(file.name);
    renderList();
    try {
      const form = new FormData();
      form.append('file', file);
      const b = await api('/upload', { method: 'POST', body: form });
      toast(b.issues.length ? `${file.name}: ${plural(b.issues.length, 'issue')} found, needs review`
                            : `${file.name}: all checks passed ✓`, b.issues.length ? '' : 'good');
      pending.splice(pending.indexOf(file.name), 1);
      await loadBills();
      await select(b.id);
    } catch (e) {
      pending.splice(pending.indexOf(file.name), 1);
      renderList();
      toast(`${file.name}: ${e.message}`, 'error');
    }
  }
}

/* ---------- events ---------- */

$('#drop').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { upload([...fileInput.files]); fileInput.value = ''; });
for (const type of ['dragenter', 'dragover']) $('#drop').addEventListener(type, e => { e.preventDefault(); $('#drop').classList.add('over'); });
for (const type of ['dragleave', 'drop']) $('#drop').addEventListener(type, () => $('#drop').classList.remove('over'));
$('#drop').addEventListener('drop', e => { e.preventDefault(); upload([...e.dataTransfer.files]); });
// a file dropped anywhere else should not navigate away from the dashboard
for (const type of ['dragover', 'drop']) window.addEventListener(type, e => e.preventDefault());

$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (b) { tab = b.dataset.tab; renderList(); }
});
list.addEventListener('click', e => {
  const b = e.target.closest('.item');
  if (b) select(+b.dataset.id);
});

main.addEventListener('focusin', e => { if (e.target.dataset.key) highlight(e.target.dataset.key); });
main.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-key], .field, tr');
  const input = el?.dataset?.key ? el : el?.querySelector?.('[data-key]');
  if (input) highlight(input.dataset.key);
});
main.addEventListener('change', e => { if (e.target.dataset.key) save(e.target); });
main.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.key) e.target.blur(); });
main.addEventListener('click', async e => {
  const issue = e.target.closest('.issue');
  if (issue) return focusField(issue.dataset.target);
  const box = e.target.closest('.box');
  if (box) return focusField(box.dataset.src);
  if (e.target.id === 'approve') {
    try {
      current = await api(`/bills/${current.id}/approve`, { method: 'POST' });
      renderDetail();
      await loadBills();
      toast('Approved. Ready for export.', 'good');
    } catch (err) { toast(err.message, 'error'); }
  }
});

(async () => {
  renderEmpty();
  try { await loadBills(); } catch (e) { return toast(`Cannot reach the Hayara.ai server: ${e.message}`, 'error'); }
  const id = +(location.hash.match(/^#bill\/(\d+)$/) || [])[1];
  if (id) select(id);
})();
</script>
</body>
</html>
