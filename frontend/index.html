<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hayara.ai · Hospital bill reader</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a65f7'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: #eef1f7; --panel: #fff; --ink: #0b1630; --muted: #5a6478; --line: #e3e7ef;
    --blue: #4f46e5; --blue-soft: #eef0ff; --blue-ink: #3730a3; --teal: #14b8a6;
    --orange: #f08722; --orange-soft: #fff1e0; --orange-ink: #9a4a06;
    --green: #0f7654; --green-soft: #e1f6ec;
    --red: #d62839; --red-soft: #fdecee;
    --radius: 14px;
    --shadow: 0 1px 2px rgb(11 22 48 / .06), 0 8px 24px rgb(11 22 48 / .06);
    font-family: "Plus Jakarta Sans", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); background: var(--bg);
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* top bar */
  .top { display: flex; align-items: center; gap: 22px; padding: 12px 22px; color: #fff;
         background: radial-gradient(120% 220% at 0% 0%, #2a2580 0%, #0b1630 55%, #062a33 100%); }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; }
  .logo { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center;
          background: linear-gradient(135deg, #6366f1, var(--teal)); box-shadow: 0 6px 18px rgb(20 184 166 / .35); }
  .brand strong { display: block; font-size: 20px; font-weight: 800; letter-spacing: -.2px; }
  .brand strong em { font-style: normal; color: #5eead4; }
  .brand span { font-size: 12.5px; color: #b9c2dc; }
  .stats { display: flex; gap: 8px; }
  .stats div { padding: 6px 12px; border-radius: 10px; background: rgb(255 255 255 / .07); border: 1px solid rgb(255 255 255 / .1);
               font-size: 11.5px; color: #b9c2dc; line-height: 1.25; }
  .stats b { display: block; font-size: 18px; font-weight: 800; color: #fff; }
  .stats .rate b { color: #5eead4; }
  .export { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #b9c2dc; }
  .export a { color: #fff; text-decoration: none; padding: 8px 13px; border: 1px solid rgb(255 255 255 / .18); border-radius: 10px; font-weight: 700; }
  .export a:hover { background: rgb(255 255 255 / .1); }
  .export a.main { background: linear-gradient(135deg, #6366f1, #4f46e5); border-color: transparent; box-shadow: 0 4px 14px rgb(79 70 229 / .45); }

  .layout { flex: 1; display: grid; grid-template-columns: 310px 1fr; min-height: 0; }

  /* sidebar */
  .side { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-right: 1px solid var(--line); background: var(--panel); min-height: 0; }
  .drop { display: grid; justify-items: center; gap: 4px; padding: 18px 14px; text-align: center; color: var(--blue-ink);
          background: linear-gradient(var(--blue-soft), var(--blue-soft)) padding-box,
                      repeating-linear-gradient(90deg, #a5b4fc 0 8px, transparent 8px 14px) border-box;
          border: 2px dashed #a5b4fc; border-radius: var(--radius); transition: transform .15s, background .15s; }
  .drop svg { width: 30px; height: 30px; }
  .drop strong { font-size: 15px; }
  .drop span { font-size: 12px; color: var(--muted); }
  .drop:hover { transform: translateY(-1px); }
  .drop.over { border-color: var(--blue); background: #e0e3ff; transform: scale(1.02); }
  .tabs { display: flex; gap: 4px; padding: 4px; background: var(--bg); border-radius: 12px; }
  .tabs button { flex: 1; border: 0; background: none; padding: 7px 4px; border-radius: 9px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
  .tabs button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgb(11 22 48 / .14); }
  .list { list-style: none; margin: 0; padding: 2px; overflow-y: auto; display: grid; gap: 8px; align-content: start; }
  .item { width: 100%; text-align: left; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; padding: 11px 12px;
          background: var(--panel); border: 1px solid var(--line); border-radius: 12px; position: relative; overflow: hidden;
          transition: border-color .15s, box-shadow .15s, transform .15s; }
  .item::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--orange); }
  .item.approved::before { background: var(--green); }
  .item:hover { border-color: #c3cad8; transform: translateX(2px); }
  .item.on { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue), 0 6px 18px rgb(79 70 229 / .15); }
  .item .ic { grid-row: 1 / 3; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 16px;
              background: var(--orange-soft); }
  .item.approved .ic { background: var(--green-soft); }
  .item .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .s { grid-column: 2; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .m { grid-column: 3; grid-row: 1 / 3; display: grid; justify-items: end; align-content: center; gap: 4px; font-size: 13px; font-weight: 700; }
  .none, .busy { font-size: 13px; color: var(--muted); padding: 10px 12px; }
  .busy { display: flex; gap: 10px; align-items: center; border: 1px dashed #a5b4fc; border-radius: 12px; background: var(--blue-soft); color: var(--blue-ink);
          position: relative; overflow: hidden; }
  .busy::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgb(255 255 255 / .7), transparent);
                 transform: translateX(-100%); animation: shimmer 1.4s infinite; }
  @keyframes shimmer { to { transform: translateX(100%); } }
  .spin { width: 14px; height: 14px; border: 2px solid #c7d2fe; border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .pill { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 800; white-space: nowrap; }
  .pill.approved { background: var(--green-soft); color: var(--green); }
  .pill.review { background: var(--orange-soft); color: var(--orange-ink); }

  /* main */
  main { min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .empty { margin: auto; max-width: 880px; padding: 28px; display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: center; }
  .empty .kicker { display: inline-block; font-size: 12px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--blue);
                   background: var(--blue-soft); padding: 5px 10px; border-radius: 99px; margin-bottom: 14px; }
  .empty h1 { font-size: 36px; line-height: 1.1; letter-spacing: -.8px; margin: 0 0 12px; }
  .empty h1 span { background: linear-gradient(90deg, var(--blue), var(--teal)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .empty p { color: var(--muted); margin: 0 0 22px; font-size: 15px; }
  .steps { display: grid; gap: 10px; }
  .steps div { display: grid; grid-template-columns: 34px 1fr; gap: 2px 12px; background: var(--panel); border: 1px solid var(--line);
               border-radius: 12px; padding: 12px 14px; font-size: 13px; color: var(--muted); box-shadow: var(--shadow); }
  .steps i { grid-row: 1 / 3; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-style: normal; font-weight: 800;
             color: #fff; background: linear-gradient(135deg, #6366f1, var(--teal)); }
  .steps b { color: var(--ink); font-size: 14px; }
  .mock { position: relative; background: #fff; border-radius: 16px; padding: 22px 22px 18px; box-shadow: 0 30px 60px rgb(11 22 48 / .18);
          transform: rotate(-3deg); overflow: hidden; font-size: 12px; color: var(--muted); }
  .mock h3 { margin: 0 0 4px; font-size: 14px; color: var(--ink); }
  .mock .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .mock .row.bad { color: var(--red); font-weight: 800; }
  .mock .row.bad b { outline: 2px solid var(--red); outline-offset: 2px; border-radius: 3px; }
  .mock::after, .page.sweep::after { content: ""; position: absolute; left: 0; right: 0; height: 70px; top: -70px; pointer-events: none;
          background: linear-gradient(transparent, rgb(20 184 166 / .28), rgb(20 184 166 / .9) 96%, transparent);
          animation: sweep 2.6s ease-in-out infinite; }
  .page.sweep::after { animation: sweep 1.1s ease-in-out 1 forwards; }
  @keyframes sweep { to { top: 100%; } }

  .bar { display: flex; align-items: center; gap: 16px; padding: 14px 22px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .bar h1 { margin: 0; font-size: 21px; letter-spacing: -.3px; }
  .bar h1:focus { outline: none; }
  .bar p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
  .bar .grow { flex: 1; min-width: 0; }
  .ring { --p: 0; --c: var(--green); flex: none; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center;
          background: conic-gradient(var(--c) calc(var(--p) * 1%), #e8ebf2 0); }
  .ring b { width: 42px; height: 42px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 11.5px; font-weight: 800; line-height: 1; letter-spacing: -.3px; }
  .ring small { display: block; font-size: 8.5px; font-weight: 700; color: var(--muted); letter-spacing: .4px; }
  .flow { display: flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; color: var(--muted); }
  .flow span { padding: 5px 9px; border-radius: 99px; background: var(--bg); white-space: nowrap; }
  .flow span.done { background: var(--green-soft); color: var(--green); }
  .flow span.now { background: var(--orange-soft); color: var(--orange-ink); box-shadow: 0 0 0 2px rgb(240 135 34 / .3); }
  .flow span.no { background: var(--red-soft); color: var(--red); }
  .flow em { font-style: normal; color: #b5bccb; }
  .btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 800; background: var(--green); color: #fff; white-space: nowrap;
         box-shadow: 0 4px 14px rgb(15 118 84 / .3); }
  .btn.ghost { background: var(--panel); color: var(--blue-ink); border: 1px solid #c7d2fe; box-shadow: none; }
  .btn:hover { filter: brightness(1.08); }

  .panes { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(430px, 1fr); }
  .viewer { overflow: auto; padding: 18px; background: #dde2ec radial-gradient(#c9d0de 1px, transparent 1px) 0 0 / 18px 18px; }
  .page { position: relative; max-width: 900px; margin: 0 auto; background: #fff; border-radius: 6px; overflow: hidden;
          box-shadow: 0 2px 4px rgb(11 22 48 / .08), 0 18px 40px rgb(11 22 48 / .18); }
  .page img { display: block; width: 100%; }
  .page iframe { display: block; width: 100%; height: calc(100vh - 170px); border: 0; }
  .box { position: absolute; border-radius: 4px; padding: 0; background: none; border: 2px solid transparent; transition: box-shadow .15s, background .15s; }
  .box.flag { border-color: var(--orange); background: rgb(240 135 34 / .14); }
  .box.flag.err { border-color: var(--red); background: rgb(214 40 57 / .12); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px rgb(214 40 57 / .18); } }
  .box.active { border-color: var(--blue); background: rgb(79 70 229 / .16); box-shadow: 0 0 0 5px rgb(79 70 229 / .2); animation: none; }
  .note { font-size: 12px; color: var(--muted); text-align: center; margin: 10px 0 0; }
  .note a { color: var(--blue-ink); font-weight: 700; }

  .data { overflow-y: auto; padding: 18px 22px 40px; background: var(--panel); border-left: 1px solid var(--line); display: grid; gap: 16px; align-content: start; }
  .data h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0 0 8px; font-weight: 800; }

  .checks { border-radius: var(--radius); padding: 14px 16px; }
  .checks.ok { background: linear-gradient(135deg, #e1f6ec, #dff7f3); color: var(--green); font-weight: 700; }
  .checks.bad { background: var(--red-soft); }
  .checks.bad h2 { color: var(--red); }
  .checks.warn { background: var(--orange-soft); }
  .checks.warn h2 { color: var(--orange-ink); }
  .issue { width: 100%; text-align: left; display: flex; gap: 10px; align-items: baseline; background: var(--panel); border: 1px solid var(--line);
           border-radius: 10px; padding: 9px 11px; margin-top: 6px; font-size: 14px; transition: transform .12s, border-color .12s; }
  .issue:hover { border-color: var(--red); transform: translateX(3px); }
  .issue.warn:hover { border-color: var(--orange); }
  .issue i { font-style: normal; font-weight: 800; width: 20px; height: 20px; flex: none; border-radius: 50%; display: grid; place-items: center;
             font-size: 12px; color: #fff; background: var(--red); transform: translateY(3px); }
  .issue.warn i { background: #b85a00; }
  .issue small { display: block; color: var(--muted); font-size: 12px; }

  .math { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13.5px; }
  .math span { padding: 7px 11px; border-radius: 10px; background: var(--bg); font-weight: 600; }
  .math span.ok { background: var(--green-soft); color: var(--green); }
  .math span.no { background: var(--red-soft); color: var(--red); font-weight: 800; box-shadow: inset 0 0 0 1px rgb(214 40 57 / .35); }
  .math em { font-style: normal; color: var(--muted); font-size: 12px; }

  details { border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 14px 10px; }
  details[open] { box-shadow: var(--shadow); }
  summary { cursor: pointer; padding: 8px 0 6px; font-weight: 800; font-size: 14px; }
  summary small { font-weight: 500; color: var(--muted); }
  .field { display: grid; grid-template-columns: 130px 1fr 52px; align-items: center; gap: 8px; padding: 3px 0; }
  .field label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .field input, td input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: #fbfcfe; font-size: 13.5px; }
  .field input:hover, td input:hover { border-color: #c3cad8; }
  .field input:focus, td input:focus { outline: none; border-color: var(--blue); background: #fff; box-shadow: 0 0 0 3px rgb(79 70 229 / .18); }
  .field.err input, tr.err input { border-color: var(--red); background: var(--red-soft); }
  .field.warn input, tr.warn input { border-color: var(--orange); background: var(--orange-soft); }
  .msg { grid-column: 2 / 4; font-size: 12px; color: var(--red); margin: -1px 0 3px; font-weight: 600; }
  .field.warn .msg { color: var(--orange-ink); }
  .conf { font-size: 11.5px; text-align: right; color: var(--muted); font-weight: 700; }
  .conf.low { color: var(--orange-ink); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-size: 11.5px; color: var(--muted); font-weight: 700; padding: 4px; }
  td { padding: 3px 4px; }
  td:first-child { color: var(--muted); width: 22px; }
  .w-num { width: 92px; }
  .w-qty { width: 56px; }
  td input.num, .field input.num { text-align: right; }

  .toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 12px); background: var(--ink); color: #fff; padding: 12px 18px;
           border-radius: 12px; font-size: 14px; font-weight: 600; box-shadow: 0 12px 30px rgb(11 22 48 / .3); opacity: 0; pointer-events: none;
           transition: opacity .2s, transform .2s; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: var(--red); }
  .toast.good { background: var(--green); }

  @media (max-width: 1250px) { .flow { display: none; } }
  @media (max-width: 1100px) {
    .stats { display: none; }
    .panes { grid-template-columns: 1fr; overflow-y: auto; }
    .viewer, .data { overflow: visible; }
    .empty { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; overflow-y: auto; }
    .brand span, .export span { display: none; }
    .mock { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M5 4v16M19 4v16M5 12h14"/><path d="M9 8l3-3 3 3" stroke-width="2"/></svg></div>
    <div><strong>Hayara<em>.ai</em></strong><span>AI reads the bill. Math checks the AI. You approve only what's uncertain.</span></div>
  </div>
  <div class="stats" id="stats" aria-live="polite"></div>
  <nav class="export" aria-label="Export">
    <span>Export</span>
    <a class="main" href="/export?format=xlsx">Excel</a>
    <a href="/export?format=csv">CSV</a>
    <a href="/export?format=json" download="hayara_export.json">JSON</a>
  </nav>
</header>

<div class="layout">
  <aside class="side">
    <button class="drop" id="drop" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <strong>Upload bills</strong>
      <span>Drop scans or phone photos here, or click to choose<br>JPG · PNG · WEBP · PDF</span>
    </button>
    <input class="sr-only" id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple tabindex="-1" aria-hidden="true">
    <div class="tabs" id="tabs" role="group" aria-label="Filter bills">
      <button type="button" data-tab="all" aria-pressed="true">All</button>
      <button type="button" data-tab="review" aria-pressed="false">To review</button>
      <button type="button" data-tab="approved" aria-pressed="false">Approved</button>
    </div>
    <ul class="list" id="list" aria-label="Bills"></ul>
  </aside>
  <main id="main"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const LABELS = {
  patient_name: 'Patient name', uhid: 'UHID', age: 'Age', gender: 'Gender',
  hospital_name: 'Hospital', hospital_address: 'Address', doctor: 'Doctor',
  bill_no: 'Bill no.', bill_date: 'Bill date', admission_date: 'Admitted', discharge_date: 'Discharged',
  subtotal: 'Subtotal', discount: 'Discount', tax: 'Tax / GST', total: 'Total',
  insurer: 'Insurer', tpa: 'TPA', policy_no: 'Policy no.', claim_no: 'Claim no.', claimed_amount: 'Claimed amount',
};
const GROUPS = [
  ['Patient', ['patient_name', 'uhid', 'age', 'gender']],
  ['Hospital & bill', ['hospital_name', 'hospital_address', 'doctor', 'bill_no', 'bill_date', 'admission_date', 'discharge_date']],
  ['Amounts', ['subtotal', 'discount', 'tax', 'total']],
  ['Insurance', ['insurer', 'tpa', 'policy_no', 'claim_no', 'claimed_amount']],
];
const MONEY = new Set(['subtotal', 'discount', 'tax', 'total', 'claimed_amount']);
const COLS = [['description', 'Description', ''], ['qty', 'Qty', 'w-qty'], ['rate', 'Rate', 'w-num'], ['amount', 'Amount', 'w-num']];
const MIN_CONFIDENCE = 0.8;  // same threshold as backend/validate.py

const $ = s => document.querySelector(s);
const list = $('#list'), main = $('#main'), fileInput = $('#file');
let bills = [], tab = 'all', current = null, pending = [], saving = Promise.resolve(), toastTimer, fresh = false;

// everything shown comes from uploads or the AI, so it is always escaped
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// same parsing as backend amount(): '₹1,23,456.50' -> 123456.5
const num = v => { const m = String(v ?? '').match(/-?\d[\d,]*(?:\.\d+)?/); return m ? parseFloat(m[0].replace(/,/g, '')) : null; };
const money = v => { const n = num(v); return n === null ? '—' : n.toLocaleString('en-IN', { style: 'currency', currency: 'INR' }); };
const srcKey = key => key.startsWith('line_items.') ? key.split('.').slice(0, 2).join('.') : key;
const label = key => key.startsWith('line_items.') ? `Line ${+key.split('.')[1] + 1}` : (LABELS[key] || key);
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

function toast(text, kind = '') {
  const t = $('#toast');
  t.textContent = text;
  t.className = `toast show ${kind}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = 'toast', kind === 'error' ? 7000 : 3500);
}

async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { ...options.headers, 'X-Hayara': '1' } });
  const body = (res.headers.get('content-type') || '').includes('json') ? await res.json() : null;
  if (!res.ok) {
    const detail = body && body.detail;
    throw new Error(typeof detail === 'string' ? detail : detail ? JSON.stringify(detail) : `${res.status} ${res.statusText}`);
  }
  return body;
}

/* ---------- list ---------- */

async function loadBills() {
  bills = await api('/bills');
  renderList();
}

function renderList() {
  const review = bills.filter(b => b.status === 'review').length;
  const rate = bills.length ? Math.round(100 * (bills.length - review) / bills.length) : 0;
  $('#stats').innerHTML = `<div><b class="num">${bills.length}</b>documents</div>
    <div><b class="num">${review}</b>need review</div><div><b class="num">${bills.length - review}</b>approved</div>
    <div class="rate"><b class="num">${rate}%</b>no human needed</div>`;
  for (const b of $('#tabs').children) b.setAttribute('aria-pressed', b.dataset.tab === tab);

  const shown = tab === 'all' ? bills : bills.filter(b => b.status === tab);
  list.innerHTML =
    pending.map(name => `<li class="busy"><span class="spin" aria-hidden="true"></span>Reading ${esc(name)}…</li>`).join('') +
    (shown.length ? shown.map(b => `<li><button type="button" class="item ${b.status} ${current && b.id === current.id ? 'on' : ''}" data-id="${b.id}">
        <span class="ic" aria-hidden="true">${b.document_type === 'claim_form' ? '🛡️' : '🧾'}</span>
        <span class="t">${esc(b.patient_name || 'Patient name missing')}</span>
        <span class="s">${b.document_type === 'claim_form' ? 'Claim · ' : ''}${esc(b.hospital_name || b.filename)}</span>
        <span class="m"><span class="num">${money(b.total)}</span>
          <span class="pill ${b.status}">${b.status === 'approved' ? 'Approved' : plural(b.issue_count, 'issue')}</span></span>
      </button></li>`).join('')
    : pending.length ? '' : `<li class="none">${bills.length ? 'Nothing here.' : 'No bills yet. Upload one to start.'}</li>`);
}

/* ---------- detail ---------- */

function fieldRow(key, f, issue) {
  const id = `f-${key}`;
  const conf = String(f.value).trim() ? Math.round(f.confidence * 100) : null;
  const cls = issue ? (issue.rule === 'low_confidence' ? 'warn' : 'err') : '';
  return `<div class="field ${cls}">
    <label for="${id}">${esc(LABELS[key])}</label>
    <input id="${id}" data-key="${key}" value="${esc(f.value)}" ${MONEY.has(key) ? 'class="num" inputmode="decimal"' : ''}
      ${issue ? `aria-describedby="${id}-msg" aria-invalid="true"` : ''}>
    <span class="conf ${conf !== null && f.confidence < MIN_CONFIDENCE ? 'low' : ''}" title="How sure the AI is it read this correctly">${conf === null ? '' : conf + '%'}</span>
    ${issue ? `<p class="msg" id="${id}-msg">${esc(issue.message)}</p>` : ''}
  </div>`;
}

function renderDetail() {
  const b = current, d = b.data, f = d.fields;
  const issueFor = {};  // first issue per field key; line item issues also mark their row
  for (const i of b.issues) {
    issueFor[i.field] ??= i;
    issueFor[srcKey(i.field)] ??= i;
  }
  const sources = d.sources || {};

  const boxes = Object.entries(sources).map(([key, [x, y, w, h]]) => {
    const issue = issueFor[key];
    const cls = issue ? `flag ${issue.rule === 'low_confidence' ? '' : 'err'}` : '';
    return `<button type="button" tabindex="-1" class="box ${cls}" data-src="${esc(key)}" aria-label="${esc(label(key))} on the scan"
      style="left:calc(${x * 100}% - 4px);top:calc(${y * 100}% - 3px);width:calc(${w * 100}% + 8px);height:calc(${h * 100}% + 6px)"></button>`;
  }).join('');

  const itemsSum = d.line_items.reduce((s, i) => s + (num(i.amount) ?? 0), 0);
  const rules = new Set(b.issues.map(i => i.rule));
  const step = (text, bad, missing) => `<span class="${bad ? 'no' : missing ? '' : 'ok'}">${text}</span>`;

  // trust score: share of read values (fields + line items) that are confident and pass every check
  const values = [...Object.entries(f).filter(([, v]) => String(v.value).trim()), ...d.line_items.map((it, n) => [`line_items.${n}`, it])];
  const trusted = values.filter(([k, v]) => !issueFor[k] && v.confidence >= MIN_CONFIDENCE).length;
  const trust = values.length ? Math.round(100 * trusted / values.length) : 0;
  const ringColor = b.status === 'approved' ? 'var(--green)' : trust >= 80 ? 'var(--orange)' : 'var(--red)';
  const nextReview = bills.find(x => x.status === 'review' && x.id !== b.id);
  const sweep = fresh; fresh = false;

  main.innerHTML = `
    <div class="bar">
      <div class="ring" style="--p:${trust};--c:${ringColor}" title="Trust score: ${trusted} of ${values.length} values read confidently and passing every check">
        <b>${trust}%<small>TRUST</small></b></div>
      <div class="grow">
        <h1 tabindex="-1">${esc(f.patient_name.value || 'Patient name missing')}</h1>
        <p>${[d.document_type === 'claim_form' && 'Insurance claim', d.engine && `Read by ${d.engine}`, f.hospital_name.value, f.bill_no.value && `Bill ${f.bill_no.value}`, f.bill_date.value, b.filename].filter(Boolean).map(esc).join(' · ')}</p>
      </div>
      <div class="flow" aria-label="Progress">
        <span class="done">Read</span><em>→</em>${b.issues.some(i => i.rule !== 'low_confidence') ? '<span class="no">Math: problem found</span>' : '<span class="done">Math checked</span>'}<em>→</em>
        <span class="${b.status === 'approved' ? 'done' : 'now'}">${b.status === 'approved' ? 'Verified' : 'Human review'}</span><em>→</em>
        <span class="${b.status === 'approved' ? 'done' : ''}">Export</span>
      </div>
      <span class="pill ${b.status}">${b.status === 'approved' ? 'Approved' : 'Needs review'}</span>
      ${b.status === 'review' ? '<button type="button" class="btn" id="approve">Approve as is</button>'
        : nextReview ? `<button type="button" class="btn ghost" id="next" data-id="${nextReview.id}">Review next →</button>` : ''}
    </div>
    <div class="panes">
      <div class="viewer" id="viewer">
        <div class="page ${sweep ? 'sweep' : ''}">
          ${b.mime_type === 'application/pdf' && !d.preview
            ? `<iframe src="/bills/${b.id}/file" title="Scan of ${esc(b.filename)}"></iframe>`
            : `<img src="/bills/${b.id}/${d.preview ? 'preview' : 'file'}" alt="Scan of ${esc(b.filename)}${d.preview ? ', page 1' : ''}">${boxes}`}
        </div>
        ${d.preview ? `<p class="note"><a href="/bills/${b.id}/file" target="_blank" rel="noopener">Open the original PDF</a> · highlights show page 1</p>` : ''}
        <p class="note">${Object.keys(sources).length
          ? 'Hover or click a field to see where it was read on the scan.'
          : 'Highlights on the scan are available for image uploads.'}</p>
      </div>
      <div class="data">
        ${b.issues.length ? `<section class="checks ${b.issues.some(i => i.rule !== 'low_confidence') ? 'bad' : 'warn'}" aria-labelledby="checks-h">
            <h2 id="checks-h">${plural(b.issues.length, 'issue')} to check${b.status === 'approved' ? ' · approved by reviewer' : ''}</h2>
            ${b.issues.map(i => `<button type="button" class="issue ${i.rule === 'low_confidence' ? 'warn' : ''}" data-target="${esc(i.field)}">
              <i aria-hidden="true">${i.rule === 'low_confidence' ? '?' : '!'}</i>
              <span>${esc(i.message)}<small>${esc(label(i.field))} · ${i.rule === 'low_confidence' ? 'click, check it, press Enter to confirm' : 'click to fix'}</small></span></button>`).join('')}
          </section>`
        : `<section class="checks ok">✓ All checks passed: required fields, line math, duplicates, subtotal, total and AI confidence.</section>`}

        ${d.document_type !== 'bill' ? '' : `<section aria-labelledby="math-h">
          <h2 id="math-h">Math check</h2>
          <div class="math num">
            ${step(`Items ${money(itemsSum)}`, rules.has('items_sum') || rules.has('line_math'))}<em>→</em>
            ${step(`Subtotal ${money(f.subtotal.value)}`, rules.has('items_sum'), num(f.subtotal.value) === null)}<em>− discount + tax →</em>
            ${step(`Total ${money(f.total.value)}`, rules.has('total_math') || num(f.total.value) === null)}
          </div>
        </section>`}

        ${GROUPS.map(([title, keys]) => {
          const filled = keys.filter(k => String(f[k].value).trim()).length;
          const flagged = keys.some(k => issueFor[k]);
          return `<details ${filled || flagged ? 'open' : ''}>
            <summary>${title} <small>${filled || flagged ? '' : '· not on this document'}</small></summary>
            ${keys.map(k => fieldRow(k, f[k], issueFor[k])).join('')}
          </details>`;
        }).join('')}

        <section aria-labelledby="items-h">
          <h2 id="items-h">Line items (${d.line_items.length})</h2>
          <table>
            <thead><tr><th>#</th>${COLS.map(([, name, w]) => `<th class="${w}">${name}</th>`).join('')}<th class="w-qty">AI</th></tr></thead>
            <tbody>${d.line_items.map((item, n) => {
              const issue = issueFor[`line_items.${n}`];
              const cls = issue ? (issue.rule === 'low_confidence' ? 'warn' : 'err') : '';
              return `<tr class="${cls}" ${issue ? `title="${esc(issue.message)}"` : ''}><td>${n + 1}</td>
                ${COLS.map(([col, name]) => `<td><input data-key="line_items.${n}.${col}" value="${esc(item[col])}"
                  aria-label="Line ${n + 1} ${name.toLowerCase()}" ${col === 'description' ? '' : 'class="num" inputmode="decimal"'}></td>`).join('')}
                <td class="conf ${item.confidence < MIN_CONFIDENCE ? 'low' : ''}">${Math.round(item.confidence * 100)}%</td></tr>`;
            }).join('')}</tbody>
          </table>
        </section>
      </div>
    </div>`;
}

function highlight(key) {
  const src = srcKey(key);
  for (const box of main.querySelectorAll('.box.active')) box.classList.remove('active');
  const box = main.querySelector(`.box[data-src="${src}"]`), note = main.querySelector('#viewer .note');
  if (note && main.querySelector('.box'))
    note.textContent = box ? 'Hover or click a field to see where it was read on the scan.'
                           : `${label(key)} could not be found on the scan image. Check it by eye.`;
  if (!box) return;
  box.classList.add('active');
  const viewer = $('#viewer'), r = box.getBoundingClientRect(), v = viewer.getBoundingClientRect();
  if (r.top < v.top || r.bottom > v.bottom) viewer.scrollBy({ top: r.top - v.top - v.height / 3, behavior: 'smooth' });
}

function focusField(key) {
  const input = main.querySelector(`input[data-key="${key}"]`) || main.querySelector(`input[data-key^="${key}."]`);
  if (!input) return;
  input.closest('details')?.setAttribute('open', '');
  input.focus();
  input.select();
}

let pointerDown = false;
addEventListener('pointerdown', () => pointerDown = true, true);
for (const type of ['pointerup', 'pointercancel']) addEventListener(type, () => pointerDown = false, true);
// re-rendering between mousedown and mouseup swallows the click, so wait until the button is released
const afterRelease = () => pointerDown && new Promise(r => {
  const done = () => { removeEventListener('pointerup', done); removeEventListener('pointercancel', done); setTimeout(r); };
  addEventListener('pointerup', done); addEventListener('pointercancel', done);
});

async function select(id) {
  document.activeElement?.blur();  // an unsaved edit fires its change now, while `current` is still its own bill
  try {
    current = await api(`/bills/${id}`);
  } catch (e) {
    current = null;
    renderEmpty();
    return toast(e.message, 'error');
  }
  history.replaceState(null, '', `#bill/${id}`);
  fresh = true;  // play the scan sweep once when a bill opens, not on every save
  renderDetail();
  renderList();
}

// force: Enter on an unchanged value confirms it (clears "AI is only 62% sure")
function save(input, force = false) {
  const key = input.dataset.key, value = input.value, id = current.id, before = input.defaultValue;
  if (value === before && !force) return;
  input.defaultValue = value;  // the blur that follows Enter must not send the same edit again
  const wasApproved = current.status === 'approved';
  // one request at a time, so fast tabbing through fields never races
  saving = saving.then(async () => {
    try {
      const updated = await api(`/bills/${id}`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ field: key, value }),
      });
      await afterRelease();
      if (!current || current.id !== id) return loadBills();
      // keep the reviewer exactly where they were: focused field, selection, scroll positions
      const active = document.activeElement;
      const focused = active?.dataset?.key || (active === document.body ? key : null);
      const sel = [active?.selectionStart, active?.selectionEnd];
      const scrollers = () => [main.querySelector('.panes'), $('#viewer'), main.querySelector('.data')];
      const scroll = scrollers().map(el => el?.scrollTop || 0);
      current = updated;
      renderDetail();
      scrollers().forEach((el, i) => el && (el.scrollTop = scroll[i]));
      // focus was on something the re-render replaced (an issue, a section header): go back to the saved field
      const el = main.querySelector(`input[data-key="${focused || key}"]`);
      if (el) {
        el.focus({ preventScroll: true });
        if (focused === active?.dataset?.key && sel[0] != null) el.setSelectionRange(sel[0], sel[1]);
      }
      const n = updated.issues.length;
      toast(wasApproved && updated.status === 'review' ? `Saved ${label(key)}. That created a new problem, so the bill needs review again.`
            : n ? `Saved ${label(key)}. ${plural(n, 'issue')} left.` : `Saved ${label(key)}. All checks pass ✓`, n ? '' : 'good');
      await loadBills();
    } catch (e) {
      toast(`Could not save ${label(key)}: ${e.message}`, 'error');
      if (input.isConnected) input.value = input.defaultValue = before;
    }
  });
}

function approve() {
  const id = current.id;
  saving = saving.then(async () => {  // after any pending edit, so the approval sees the latest data
    try {
      const b = await api(`/bills/${id}/approve`, { method: 'POST' });
      if (current && current.id === id) {
        current = b;
        renderDetail();
        main.querySelector('.bar h1').focus();
      }
      await loadBills();
      if (current && current.id === id) renderDetail();
      toast('Approved. Ready for export.', 'good');
    } catch (e) { toast(e.message, 'error'); }
  });
}

function renderEmpty() {
  main.innerHTML = `<div class="empty">
    <div>
      <span class="kicker">Hospital bills · Insurance claims</span>
      <h1>Read any bill. <span>Catch every wrong rupee.</span></h1>
      <p>Drop a scan, phone photo or PDF. Hayara reads it, checks the math, and only asks you about what's uncertain.</p>
      <div class="steps">
        <div><i>1</i><b>AI reads</b>Patient, hospital, every charge, totals and claim data.</div>
        <div><i>2</i><b>Math checks the AI</b>Qty × rate, items → subtotal → total, duplicates, claim vs bill.</div>
        <div><i>3</i><b>You approve only the doubts</b>Click any value to see where it came from. Export to Excel.</div>
      </div>
    </div>
    <div class="mock" aria-hidden="true">
      <h3>CITY CARE HOSPITAL</h3>Final bill · IP-2026-0418
      <div class="row"><span>Room rent 3 × 2,000</span><b>6,000</b></div>
      <div class="row"><span>Pharmacy</span><b>1,240</b></div>
      <div class="row"><span>CBC test</span><b>450</b></div>
      <div class="row"><span>Subtotal</span><b>7,690</b></div>
      <div class="row bad"><span>Total ⚠ should be 7,690</span><b>8,490</b></div>
    </div>
  </div>`;
}

async function upload(files) {
  for (const file of files) {
    pending.push(file.name);
    renderList();
    try {
      const form = new FormData();
      form.append('file', file);
      const b = await api('/upload', { method: 'POST', body: form });
      toast(b.issues.length ? `${file.name}: ${plural(b.issues.length, 'issue')} found, needs review`
                            : `${file.name}: all checks passed ✓`, b.issues.length ? '' : 'good');
      pending.splice(pending.indexOf(file.name), 1);
      await loadBills();
      const a = document.activeElement;  // don't yank the reviewer away from an edit they haven't saved yet
      if (!(a?.dataset?.key && a.value !== a.defaultValue)) await select(b.id);
    } catch (e) {
      pending.splice(pending.indexOf(file.name), 1);
      renderList();
      toast(`${file.name}: ${e.message}`, 'error');
    }
  }
}

/* ---------- events ---------- */

$('#drop').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { upload([...fileInput.files]); fileInput.value = ''; });
for (const type of ['dragenter', 'dragover']) $('#drop').addEventListener(type, e => { e.preventDefault(); $('#drop').classList.add('over'); });
for (const type of ['dragleave', 'drop']) $('#drop').addEventListener(type, () => $('#drop').classList.remove('over'));
$('#drop').addEventListener('drop', e => { e.preventDefault(); upload([...e.dataTransfer.files]); });
// a file dropped anywhere else should not navigate away from the dashboard
for (const type of ['dragover', 'drop']) window.addEventListener(type, e => e.preventDefault());

$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]');
  if (b) { tab = b.dataset.tab; renderList(); }
});
list.addEventListener('click', e => {
  const b = e.target.closest('.item');
  if (b) select(+b.dataset.id).then(() => list.querySelector('.item.on')?.focus());
});

main.addEventListener('focusin', e => { if (e.target.dataset.key) highlight(e.target.dataset.key); });
main.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-key], .field, tr');
  const input = el?.dataset?.key ? el : el?.querySelector?.('[data-key]');
  if (input) highlight(input.dataset.key);
});
main.addEventListener('change', e => { if (e.target.dataset.key) save(e.target); });
main.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset.key) { e.preventDefault(); save(e.target, true); }
});
main.addEventListener('click', async e => {
  const issue = e.target.closest('.issue');
  if (issue) {
    focusField(issue.dataset.target);
    return;
  }
  const box = e.target.closest('.box');
  if (box) return focusField(box.dataset.src);
  if (e.target.id === 'approve') approve();
  if (e.target.id === 'next') select(+e.target.dataset.id);
});

(async () => {
  renderEmpty();
  try { await loadBills(); } catch (e) { return toast(`Cannot reach the Hayara.ai server: ${e.message}`, 'error'); }
  const id = +(location.hash.match(/^#bill\/(\d+)$/) || [])[1];
  if (id) select(id);
})();
</script>
</body>
</html>
